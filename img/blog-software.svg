<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="De planillas desordenadas a un sistema de gestión a medida">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1f"/>
      <stop offset="55%" stop-color="#0a1f4d"/>
      <stop offset="100%" stop-color="#1e6fff" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00c2e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00c2e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#050d1f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e6fff"/>
      <stop offset="100%" stop-color="#00c2e0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Planillas desordenadas (izquierda) -->
  <g transform="translate(70,130) rotate(-8)" opacity="0.55">
    <rect width="150" height="110" rx="6" fill="#f5f9ff" fill-opacity="0.08" stroke="#a8d8ff" stroke-opacity="0.5" stroke-width="1.5"/>
    <g stroke="#a8d8ff" stroke-opacity="0.35" stroke-width="1">
      <line x1="0" y1="22" x2="150" y2="22"/><line x1="0" y1="44" x2="150" y2="44"/>
      <line x1="0" y1="66" x2="150" y2="66"/><line x1="0" y1="88" x2="150" y2="88"/>
      <line x1="50" y1="0" x2="50" y2="110"/><line x1="100" y1="0" x2="100" y2="110"/>
    </g>
  </g>
  <g transform="translate(110,175) rotate(6)" opacity="0.8">
    <rect width="150" height="110" rx="6" fill="#0d1f3c" stroke="#a8d8ff" stroke-opacity="0.6" stroke-width="1.5"/>
    <g stroke="#a8d8ff" stroke-opacity="0.35" stroke-width="1">
      <line x1="0" y1="22" x2="150" y2="22"/><line x1="0" y1="44" x2="150" y2="44"/>
      <line x1="0" y1="66" x2="150" y2="66"/><line x1="0" y1="88" x2="150" y2="88"/>
      <line x1="50" y1="0" x2="50" y2="110"/><line x1="100" y1="0" x2="100" y2="110"/>
    </g>
    <rect x="52" y="46" width="46" height="18" fill="#ff6b6b" fill-opacity="0.55"/>
    <rect x="2" y="90" width="46" height="18" fill="#ff6b6b" fill-opacity="0.35"/>
  </g>
  <!-- Burbujas de chat sueltas -->
  <g fill="none" stroke="#00c2e0" stroke-width="2" stroke-linejoin="round" opacity="0.8">
    <path d="M 70 300 h 56 a 8 8 0 0 1 8 8 v 22 a 8 8 0 0 1 -8 8 h -38 l -12 10 v -10 h -6 a 8 8 0 0 1 -8 -8 v -22 a 8 8 0 0 1 8 -8 z"/>
    <path d="M 200 320 h 46 a 8 8 0 0 1 8 8 v 18 a 8 8 0 0 1 -8 8 h -6 v 10 l -12 -10 h -28 a 8 8 0 0 1 -8 -8 v -18 a 8 8 0 0 1 8 -8 z"/>
  </g>
  <g fill="#00c2e0" opacity="0.8">
    <circle cx="88" cy="319" r="3"/><circle cx="98" cy="319" r="3"/><circle cx="108" cy="319" r="3"/>
  </g>

  <!-- Flecha de transformación -->
  <g stroke="#00c2e0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300 235 C 330 215, 350 215, 380 235" stroke-dasharray="6 7"/>
    <path d="M 370 222 L 382 236 L 366 243"/>
  </g>

  <!-- Pantalla del sistema (derecha) -->
  <g transform="translate(410,95)">
    <rect width="320" height="215" rx="14" fill="url(#screen)" stroke="#00c2e0" stroke-width="2"/>
    <rect width="320" height="30" rx="14" fill="#1e6fff" fill-opacity="0.25"/>
    <rect y="16" width="320" height="14" fill="#1e6fff" fill-opacity="0.25"/>
    <g fill="#a8d8ff" opacity="0.8"><circle cx="18" cy="15" r="4"/><circle cx="32" cy="15" r="4"/><circle cx="46" cy="15" r="4"/></g>
    <!-- menú lateral -->
    <g fill="#a8d8ff" fill-opacity="0.25">
      <rect x="16" y="46" width="60" height="10" rx="5"/>
      <rect x="16" y="66" width="48" height="10" rx="5"/>
      <rect x="16" y="86" width="54" height="10" rx="5"/>
      <rect x="16" y="106" width="44" height="10" rx="5"/>
    </g>
    <rect x="16" y="46" width="60" height="10" rx="5" fill="#00c2e0"/>
    <!-- tarjetas KPI -->
    <g>
      <rect x="92" y="44" width="66" height="44" rx="8" fill="#f5f9ff" fill-opacity="0.07" stroke="#a8d8ff" stroke-opacity="0.3"/>
      <rect x="168" y="44" width="66" height="44" rx="8" fill="#f5f9ff" fill-opacity="0.07" stroke="#a8d8ff" stroke-opacity="0.3"/>
      <rect x="244" y="44" width="60" height="44" rx="8" fill="#f5f9ff" fill-opacity="0.07" stroke="#a8d8ff" stroke-opacity="0.3"/>
      <rect x="102" y="56" width="34" height="8" rx="4" fill="#00c2e0"/>
      <rect x="102" y="70" width="22" height="6" rx="3" fill="#a8d8ff" fill-opacity="0.5"/>
      <rect x="178" y="56" width="40" height="8" rx="4" fill="#1e6fff"/>
      <rect x="178" y="70" width="26" height="6" rx="3" fill="#a8d8ff" fill-opacity="0.5"/>
      <rect x="254" y="56" width="30" height="8" rx="4" fill="#f5f9ff"/>
      <rect x="254" y="70" width="20" height="6" rx="3" fill="#a8d8ff" fill-opacity="0.5"/>
    </g>
    <!-- gráfico -->
    <g fill="url(#bar)">
      <rect x="100" y="160" width="18" height="36" rx="3"/>
      <rect x="128" y="146" width="18" height="50" rx="3"/>
      <rect x="156" y="132" width="18" height="64" rx="3"/>
      <rect x="184" y="140" width="18" height="56" rx="3"/>
      <rect x="212" y="118" width="18" height="78" rx="3"/>
    </g>
    <line x1="92" y1="197" x2="236" y2="197" stroke="#a8d8ff" stroke-opacity="0.35"/>
    <!-- lista con checks -->
    <g stroke="#00c2e0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 250 120 l 5 5 l 9 -10"/>
      <path d="M 250 146 l 5 5 l 9 -10"/>
      <path d="M 250 172 l 5 5 l 9 -10"/>
    </g>
    <g fill="#a8d8ff" fill-opacity="0.4">
      <rect x="270" y="115" width="34" height="7" rx="3.5"/>
      <rect x="270" y="141" width="28" height="7" rx="3.5"/>
      <rect x="270" y="167" width="32" height="7" rx="3.5"/>
    </g>
  </g>
  <!-- soporte de la pantalla -->
  <rect x="550" y="310" width="40" height="18" fill="#0d1f3c" stroke="#00c2e0" stroke-opacity="0.6"/>
  <rect x="520" y="326" width="100" height="8" rx="4" fill="#00c2e0" fill-opacity="0.6"/>

  <text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="0.14em" fill="#a8d8ff" opacity="0.75">GESTIXPRO · SOFTWARE A MEDIDA</text>
  <text x="60" y="410" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#f5f9ff">De la planilla a tu propio sistema</text>
</svg>
